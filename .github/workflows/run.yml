name: Generate Instagram Quiz Reel

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/history/history.json'
  workflow_dispatch:
  schedule:
    - cron: '0 2,8,14,20 * * *'

permissions:
  contents: write

concurrency:
  group: instagram-quiz-reel
  cancel-in-progress: false

jobs:
  instagram-quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --prefer-binary -r requirements.txt

      - name: Prepare history
        run: |
          mkdir -p data/history output
          if [ ! -f data/history/history.json ]; then
            echo '{"version":3,"counters":{},"last_run":{}}' > data/history/history.json
          fi

      - name: Generate and publish 5-question mixed Instagram Reel
        env:
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          META_GRAPH_VERSION: v25.0
          INSTAGRAM_SHARE_TO_FEED: 'true'
          INSTAGRAM_STATUS_TIMEOUT: '600'
          INSTAGRAM_STATUS_POLL_SECONDS: '5'
          INSTAGRAM_UPLOAD_TIMEOUT: '900'
          QUIZ_SIZE: '5'
          MIX_ONLY: 'true'
          VIDEO_WIDTH: '720'
          VIDEO_HEIGHT: '1280'
          FPS: '30'
          VIDEO_CRF: '30'
          VIDEO_PRESET: ultrafast
          TTS_VOICE: en-IN-NeerjaNeural
          TTS_RATE: '+0%'
          TTS_VOLUME: '+0%'
          TTS_CONCURRENCY: '5'
          PAGE_URL: https://smartlearninglab-react.pages.dev
        run: python app.py

      - name: Commit quiz counter
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/history/history.json
          if git diff --cached --quiet; then
            echo 'No history changes to commit.'
            exit 0
          fi
          git commit -m 'Update Instagram quiz counter'
          git push origin HEAD:main
